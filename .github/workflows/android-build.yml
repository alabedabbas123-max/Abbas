name: Build KayPro APK

on:
  push:
    branches: [ 'arena/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate manifest, resources & package id
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Assert application id is com.almlkaide.kaypro
        run: |
          set -e
          grep -q "namespace 'com.almlkaide.kaypro'"     KayPro/build.gradle
          grep -q "applicationId 'com.almlkaide.kaypro'" KayPro/build.gradle
          grep -q 'package="com.almlkaide.kaypro"'       KayPro/AndroidManifest.xml
          if grep -rq --exclude='*.md' 'com\.aide\.pro' KayPro/; then
            echo "stale com.aide.pro reference found"; exit 1
          fi
          if grep -rq --exclude='*.md' -E '\balmlk\.(almlkid|manifesteditor|assetsmanager)' KayPro/; then
            echo "stale almlk.* package reference found"; exit 1
          fi
          echo "package id OK"

      - name: Process resources (independent of engine sources)
        working-directory: KayPro
        run: ./gradlew --no-daemon processDebugResources mergeDebugJavaResource

      - name: Upload merged manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-manifest
          path: KayPro/build/intermediates/merged_manifest/**/AndroidManifest.xml
          if-no-files-found: ignore

  assemble:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: assembleDebug
        id: assemble
        continue-on-error: true
        working-directory: KayPro
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee ../assemble-debug.log

      - name: Build report
        if: always()
        run: |
          mkdir -p ci-reports
          {
            echo "# assembleDebug report"
            echo
            echo "- run: ${{ github.run_id }}"
            echo "- commit: ${{ github.sha }}"
            echo "- result: ${{ steps.assemble.outcome }}"
            echo
            echo '## error summary'
            echo '```'
            grep -ohE 'error: .*' assemble-debug.log 2>/dev/null | sed -E 's/[0-9]+/N/g' | sort | uniq -c | sort -rn | head -40 || true
            echo '```'
            echo
            echo '## files with most errors'
            echo '```'
            grep -ohE '/KayPro/[^: ]+\.java' assemble-debug.log 2>/dev/null | sort | uniq -c | sort -rn | head -25 || true
            echo '```'
            echo
            echo '## failing tasks'
            echo '```'
            grep -ohE '^> Task .* FAILED|^FAILURE: .*' assemble-debug.log 2>/dev/null | head -20 || true
            echo '```'
          } > ci-reports/assemble-debug-report.md
          # The raw log echoes the offending source lines, so it is kept as a
          # run artifact rather than committed into the repository.
          rm -f ci-reports/assemble-debug.log
          ls -l KayPro/build/outputs/apk/debug/ 2>/dev/null >> ci-reports/assemble-debug-report.md || true
          cat ci-reports/assemble-debug-report.md | head -40

      - name: Commit report back to branch
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-reports/
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "ci: assembleDebug report for ${{ github.sha }} [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload the raw build log as a private artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assemble-debug-log
          path: assemble-debug.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KayPro-debug-apk
          path: KayPro/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Fail if APK missing
        if: always()
        run: test -n "$(ls KayPro/build/outputs/apk/debug/*.apk 2>/dev/null)"
