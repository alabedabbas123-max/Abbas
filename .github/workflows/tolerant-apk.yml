name: Build installable APK (error-tolerant)

# Produces an APK from the recovered sources despite the decompilation gaps, by
# compiling with the Eclipse compiler in -proceedOnError mode: every type still
# gets a class file, and only the methods whose code is genuinely missing throw
# at runtime. See tools/tolerant-compile.gradle.
#
# The result is a real, installable, signed APK with application id
# com.almlkaide.kaypro -- partial, but testable on a device.
#
# PRIVACY: the APK is a workflow *artifact* only. No release and no tag.

on:
  push:
    paths:
      - 'tools/tolerant-compile.gradle'
      - '.github/workflows/tolerant-apk.yml'
      - 'KayPro/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ECJ -proceedOnError -> dex -> sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Download the Eclipse compiler
        run: |
          set -e
          curl -fsSL --retry 3 -o "$GITHUB_WORKSPACE/ecj.jar" \
            https://repo1.maven.org/maven2/org/eclipse/jdt/ecj/3.33.0/ecj-3.33.0.jar
          java -jar "$GITHUB_WORKSPACE/ecj.jar" -version

      - name: Raise minSdk to 21 for this build only
        working-directory: KayPro
        run: |
          # multiDexEnabled with minSdk 16 needs the legacy multidex support
          # library; at 21 the platform loads several dex files natively, which
          # this codebase needs and every current device supports.
          sed -i "s/minSdk 16/minSdk 21/" build.gradle
          grep -n 'minSdk' build.gradle

      - name: Assemble
        id: assemble
        continue-on-error: true
        working-directory: KayPro
        env:
          ECJ_JAR: ${{ github.workspace }}/ecj.jar
          ECJ_HEAP: 5g
        run: |
          set -o pipefail
          ./gradlew --no-daemon -I ../tools/tolerant-compile.gradle \
            assembleDebug 2>&1 | tee ../tolerant-build.log

      - name: Report
        if: always()
        run: |
          mkdir -p ci-reports
          APK=$(ls KayPro/build/outputs/apk/debug/*.apk 2>/dev/null | head -1 || true)
          {
            echo "# error-tolerant build"
            echo
            echo "- run: ${{ github.run_id }}"
            echo "- commit: ${{ github.sha }}"
            echo "- gradle outcome: ${{ steps.assemble.outcome }}"
            echo "- APK: ${APK:-none}"
            echo
            echo '## ECJ'
            echo '```'
            grep -E 'ECJ: ' tolerant-build.log 2>/dev/null | head -10 || true
            for f in KayPro/ecj-*.log; do
              [ -f "$f" ] || continue
              tail -3 "$f"
            done
            echo '```'
            echo
            echo '## failing gradle tasks'
            echo '```'
            grep -ohE '^> Task .* FAILED|^FAILURE: .*|^\* What went wrong:' tolerant-build.log 2>/dev/null | head -20 || true
            echo '```'
          } > ci-reports/tolerant-build-report.md
          cat ci-reports/tolerant-build-report.md
          if [ -n "$APK" ]; then
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            AAPT="$BT/aapt"; [ -x "$AAPT" ] || AAPT="$BT/aapt2"
            "$AAPT" dump badging "$APK" | head -4 | tee -a ci-reports/tolerant-build-report.md
            ls -lh "$APK"
          fi

      - name: Upload the APK and the compiler log as private artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KayPro-tolerant-apk
          path: |
            KayPro/build/outputs/apk/debug/*.apk
            KayPro/ecj-*.log
            tolerant-build.log
            ci-reports/tolerant-build-report.md
          retention-days: 14
          if-no-files-found: warn

      # The APK is normally left in the workflow artifact only, to keep binaries
      # out of a repository that is still public. Create the marker file
      # apk-output/DELIVER to have one run copy it onto the branch instead --
      # that is the only transfer channel the agent's sandbox has, because it
      # cannot reach GitHub's artifact storage.
      - name: Publish the report (and the APK when asked)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- KayPro/build.gradle || true
          APK=$(ls KayPro/build/outputs/apk/debug/*.apk 2>/dev/null | head -1 || true)
          if [ -n "$APK" ] && [ -f apk-output/DELIVER ]; then
            cp "$APK" "apk-output/KayPro-com.almlkaide.kaypro-debug.apk"
            sha256sum apk-output/*.apk > apk-output/SHA256SUMS
            ls -lh apk-output/
            git add -f apk-output/
          fi
          git add -f ci-reports/tolerant-build-report.md
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "ci: error-tolerant APK + report for ${{ github.sha }} [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
