plugins {
    id 'com.android.application' version '7.4.2'
}

android {
    namespace 'com.almlkaide.kaypro'
    compileSdk 33

    defaultConfig {
        applicationId 'com.almlkaide.kaypro'
        minSdk 16
        targetSdk 28
        versionCode 100
        versionName '3.3'
        multiDexEnabled true
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['java', 'libraries/java']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Legacy Android Support APIs still imported by the recovered source.
    implementation 'com.android.support:support-v4:26.1.0'
    implementation 'com.android.support:appcompat-v7:26.1.0'
    implementation 'com.android.support:recyclerview-v7:26.1.0'

    // AndroidX APIs referenced by newer project additions.
    implementation 'androidx.annotation:annotation:1.5.0'
    implementation 'androidx.collection:collection:1.2.0'
    implementation 'androidx.core:core:1.9.0'
    implementation 'androidx.fragment:fragment:1.5.5'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.5.1'
    implementation 'androidx.versionedparcelable:versionedparcelable:1.1.1'

    // Official Google Play API, replacing its embedded decompiled sources.
    implementation 'com.android.installreferrer:installreferrer:2.2'

    // Components declared by the recovered manifest.
    implementation 'com.google.android.gms:play-services-ads:17.2.1'
    implementation 'com.google.firebase:firebase-core:16.0.9'
    implementation 'com.google.firebase:firebase-iid:17.1.2'

}
