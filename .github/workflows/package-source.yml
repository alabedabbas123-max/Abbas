name: Publish repaired project archive

# The repaired project already lives in this repository under KayPro/ -- this
# workflow only makes it convenient to pull down as a single file (for importing
# into AIDE or Android Studio on a phone) without cloning 97 MB of history.
#
# PRIVACY: the archive is produced as a workflow *artifact* only. No release and
# no tag is created, so nothing is attached to a public download page.

on:
  push:
    paths:
      - 'KayPro/**'
      - '.github/workflows/package-source.yml'

permissions:
  contents: write

jobs:
  package:
    name: Zip KayPro and publish it as a release asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the archive
        run: |
          set -e
          mkdir -p dist
          zip -qr dist/KayPro-repaired.zip KayPro \
            -x 'KayPro/build/*' 'KayPro/.gradle/*'
          sha256sum dist/KayPro-repaired.zip | tee dist/KayPro-repaired.zip.sha256
          ls -lh dist/

      - name: Summarise what is inside
        run: |
          set -e
          pip install --quiet javalang
          python3 - <<'EOF' | tee summary.txt
          import os, javalang
          total, bad = 0, []
          for dirpath, _, names in os.walk('KayPro'):
              for name in names:
                  if not name.endswith('.java'):
                      continue
                  path = os.path.join(dirpath, name)
                  total += 1
                  try:
                      javalang.parse.parse(open(path, encoding='utf-8', errors='replace').read())
                  except Exception:
                      bad.append(path)
          print('- java files: %d' % total)
          print('- files that do NOT parse as valid Java: %d' % len(bad))
          for path in bad[:10]:
              print('  - %s' % path)
          EOF
          grep -o "applicationId '[^']*'" KayPro/build.gradle >> summary.txt || true
          cat summary.txt

      - name: Upload as a private artifact
        uses: actions/upload-artifact@v4
        with:
          name: KayPro-repaired-source
          path: |
            dist/KayPro-repaired.zip
            dist/KayPro-repaired.zip.sha256
            summary.txt
          retention-days: 14
          if-no-files-found: error
