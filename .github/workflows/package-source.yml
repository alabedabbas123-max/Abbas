name: Publish repaired project archive

# The repaired project already lives in this repository under KayPro/ -- this
# workflow only makes it convenient to pull down as a single file (for importing
# into AIDE or Android Studio on a phone) without cloning 97 MB of history.
#
# Runs whenever KayPro/ changes and republishes the `source-latest` release.

on:
  push:
    paths:
      - 'KayPro/**'

permissions:
  contents: write

jobs:
  package:
    name: Zip KayPro and publish it as a release asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the archive
        run: |
          set -e
          mkdir -p dist
          zip -qr dist/KayPro-repaired.zip KayPro \
            -x 'KayPro/build/*' 'KayPro/.gradle/*'
          sha256sum dist/KayPro-repaired.zip | tee dist/KayPro-repaired.zip.sha256
          ls -lh dist/

      - name: Summarise what is inside
        run: |
          set -e
          {
            echo "- java files: $(find KayPro -name '*.java' | wc -l)"
            echo "- files with \`goto L\`/\`move-exception\`/\`monitor-enter\` left:"
            echo "  $(grep -rlE '(^[[:space:]]*L[0-9]+:[[:space:]]*$)|move-exception|monitor-enter' \
                 --include='*.java' KayPro | wc -l)"
            echo "- application id: $(grep -o \"applicationId '[^']*'\" KayPro/build.gradle)"
          } | tee summary.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release delete source-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create source-latest dist/KayPro-repaired.zip dist/KayPro-repaired.zip.sha256 \
            --title "KayPro - repaired sources" \
            --target "${{ github.sha }}" \
            --notes "$(cat <<EOF
          The repaired project, zipped straight from \`KayPro/\` at commit ${{ github.sha }}.

          $(cat summary.txt)

          All 6,621 Java files parse as valid Java. This archive still **cannot be
          compiled into an APK**: 10 of the components its manifest declares have no
          source file anywhere in the original decompilation. See
          \`docs/ENGINE_RECOVERY.md\`.
          EOF
          )"
